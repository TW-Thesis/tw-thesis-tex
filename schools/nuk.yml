university: "國立高雄大學"
university-en: "National University of Kaohsiung"

cover:
  size: # pt
    org: 20
    title: 18
    title-en: 18

verification:
  size: # pt
    university: 18
    title: 18
    thesis-title: 16
    body: 16
  degree-line: "{university}"
  title: "研究生學位論文審定書"
  statement: "本校{institute}{degree}班研究生{author}（學號：{id}）所提論文，經本委員會審查並舉行口試，符合{degree}學位論文標準。"

strings:
  committee: "考試委員："
  committee-advisor: "（召集人）"
  director: "系主任／所長："

watermark: # cloud.ncl.edu.tw/nuk/download.php, official (300px, low-res)
  image: "/assets/watermarks/nuk.jpg"
  width: 50 # %
