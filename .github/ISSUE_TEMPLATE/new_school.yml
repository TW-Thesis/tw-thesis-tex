name: 新增學校
description: 希望支援還沒有的學校
labels: [school]
body:
  - type: input
    id: name
    attributes:
      label: 學校名稱（中英文）
    validations: { required: true }
  - type: input
    id: url
    attributes:
      label: 官方論文格式規範網址
    validations: { required: true }
  - type: checkboxes
    id: help
    attributes:
      label: 你願意幫忙嗎？
      options:
        - label: 我可以協助對照規範、測試編譯結果
